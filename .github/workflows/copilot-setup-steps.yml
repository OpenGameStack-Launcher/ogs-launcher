name: "Copilot Setup Steps"

# Run automatically when this file changes (for validation) and allow manual runs.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be named `copilot-setup-steps` or Copilot will not pick it up.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # This repo uses Git LFS for binaries (Images/, sample tool .exe files, etc.)
      # per .gitattributes; without this, Copilot's clone gets LFS pointer files
      # instead of real content.
      - name: Checkout repository (with Git LFS)
        uses: actions/checkout@v6
        with:
          lfs: true
