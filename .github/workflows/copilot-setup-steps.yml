name: "Copilot Setup Steps"

# Run automatically when this file changes (for validation) and allow manual runs.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be named `copilot-setup-steps` or Copilot will not pick it up.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Keep checkout resilient for Copilot review runs. LFS fetch failures can
      # block review entirely, while most review-relevant files are regular text.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      # Try to hydrate LFS objects when available, but do not fail setup if LFS
      # storage has transient issues or missing historical objects.
      - name: Attempt Git LFS pull (non-blocking)
        continue-on-error: true
        run: |
          git lfs install --local
          git lfs pull
